<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de boleta de honorarios (embed) | Boleta Clara</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://infinityprojecthq.github.io/boletaclara/#calculadora">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2430;background:#fff}
.bc{max-width:420px;margin:0 auto;padding:14px;border:1px solid #d8e0ea;border-radius:10px}
h1{font-size:17px;margin:0 0 10px;color:#1F3A5F}label{display:block;font-size:13px;margin:0 0 8px;color:#425066}
select,input{display:block;width:100%;margin-top:3px;padding:8px;font-size:15px;border:1px solid #c5cfdb;border-radius:6px}
.out{display:block;margin-top:10px}.out div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef2f6}
.out .is-net b{color:#1F3A5F;font-size:17px}.note{font-size:11.5px;color:#5b6778;margin:10px 0 0}a{color:#1F3A5F}
</style>
</head>
<body>
<div class="bc">
<h1>Calculadora boleta de honorarios: bruto ↔ líquido</h1>
<form onsubmit="return false" aria-label="Calculadora de boleta de honorarios">
<label>Año de la boleta<select id="c-year"><option value="2025">2025 (14,5%)</option><option value="2026" selected>2026 (15,25%)</option><option value="2027">2027 (16%)</option><option value="2028">2028 o después (17%)</option></select></label>
<label>Tengo el monto<select id="c-mode"><option value="gross">Bruto (total de la boleta)</option><option value="net">Líquido (lo que quiero recibir)</option></select></label>
<label>Monto en pesos<input id="c-amount" type="text" inputmode="numeric" value="100.000" autocomplete="off"></label>
<output id="c-out" class="out" aria-live="polite"></output>
</form>
<p class="note">Tasas de retención según el SII (Ley 21.133). Cálculo referencial, no es asesoría tributaria. © <span id="y"></span> · Calculadora por <a href="https://infinityprojecthq.github.io/boletaclara/?utm_source=embed&amp;utm_medium=widget&amp;utm_campaign=calc" target="_blank" rel="noopener">Boleta Clara</a></p>
</div>
<script src="../assets/calc.js"></script>
</body>
</html>
